# How `zeno` itself is built for each kind of machine it is released for
# (docs/release.md). Building it for the machine you are on needs none of
# this: `cargo build --release` is enough.

# The Linux builds are linked against musl, a C library that is put into
# the program, so one file runs on every Linux whatever it has installed.
# Linking for another processor needs a linker that knows that processor.
# `rust-lld` comes with Rust and knows them all.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.i686-unknown-linux-musl]
linker = "rust-lld"

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"

[target.arm-unknown-linux-musleabihf]
linker = "rust-lld"

# On Windows the C library is put into the program too, so `zeno.exe`
# needs nothing installed beside it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Zeno for a browser (docs/web.md). The stack is where the interpreter
# keeps its place in a program, one step for every nested call, and the
# usual megabyte is not enough for 200 of them.
#
# The other four make `zeno.wasm` smaller, since every built page
# carries it: built for size where that costs no speed (`s`), as one
# piece and not sixteen, and with what nothing calls left out across
# the whole of it (`lto`). It came to 780 KB from 1.1 MB, and ran a
# loop and a recursion as fast as before (docs/web.md, decision 16.10).
[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "link-arg=-zstack-size=8388608",
    "-C", "opt-level=s",
    "-C", "codegen-units=1",
    "-C", "lto=fat",
    "-C", "embed-bitcode=yes",
]
