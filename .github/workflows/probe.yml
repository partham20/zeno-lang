# Looks into one question on one machine, and is changed for each
# question. It releases nothing.
#
# The question now: a `try` and `raise` now jump with a matched pair,
# `_setjmp` and `_longjmp`, so a caught error no longer leaves signals
# held back on macOS. Does the whole test suite pass there with the
# collector's two generations put back for macOS? This puts them back
# in a copy of the runtime and runs the suite under a clock.

name: probe

on:
  workflow_dispatch:
    inputs:
      machine:
        description: The machine to look on
        type: choice
        options: [macos-latest, ubuntu-latest]
        default: macos-latest

jobs:
  look:
    name: ${{ inputs.machine }}
    runs-on: ${{ inputs.machine }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: A runtime with two generations on macOS
        run: |
          python3 - <<'PY'
          path = 'src/runtime.c'
          s = open(path).read()

          def put(old, new):
              global s
              assert s.count(old) == 1, (old, s.count(old))
              s = s.replace(old, new)

          put('!defined(ZENO_ONE_GENERATION) && defined(__linux__)',
              '!defined(ZENO_ONE_GENERATION) && (defined(__linux__) || defined(__APPLE__))')
          open(path, 'w').write(s)
          PY
          git diff

      - name: Build the tests with it
        run: cargo test --no-run 2>&1 | tail -n 3

      - name: The whole test suite, under a clock
        run: tools/probe-tests.sh 600 two-generations

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ inputs.machine }}
          path: found
          if-no-files-found: ignore
