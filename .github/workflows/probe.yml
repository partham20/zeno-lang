# Looks into one question on one machine, and is changed for each
# question. It releases nothing.
#
# The question now: with the collector's two generations on macOS, a
# program built through LLVM spins for ever at a store into a page the
# collector made read-only, and the signal that should open the page
# never comes. A `try` in such a program calls `_setjmp`, which does not
# keep the signals that are held back, and `raise` in the runtime calls
# `longjmp`, which on macOS puts back the ones the place says were held:
# whatever was in that memory. So after one caught error the signal may
# be held back for good. This shows that with a few lines of C, and then
# runs the whole test suite under a clock with the two generations on
# macOS and `_longjmp` in the runtime, which pairs with `_setjmp`.

name: probe

on:
  workflow_dispatch:
    inputs:
      machine:
        description: The machine to look on
        type: choice
        options: [macos-latest, ubuntu-latest]
        default: macos-latest

jobs:
  look:
    name: ${{ inputs.machine }}
    runs-on: ${{ inputs.machine }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: What _setjmp and longjmp do to the signals that are held back
        run: |
          mkdir pair && cd pair
          cat > pair.c <<'C'
          #include <setjmp.h>
          #include <signal.h>
          #include <stdio.h>
          #include <string.h>

          static void say(const char *when) {
              sigset_t held;
              sigprocmask(0, NULL, &held);
              printf("%s: SIGBUS held back %d, SIGSEGV %d, SIGINT %d\n", when,
                     sigismember(&held, SIGBUS), sigismember(&held, SIGSEGV), sigismember(&held, SIGINT));
          }

          int main(void) {
              jmp_buf place;
              /* A place on the stack holds whatever was there before. */
              memset(&place, 0xff, sizeof place);
              say("at the start");
              if (_setjmp(place) == 0) longjmp(place, 1);
              say("after _setjmp and longjmp");
              sigset_t none;
              sigemptyset(&none);
              sigprocmask(SIG_SETMASK, &none, NULL);
              memset(&place, 0xff, sizeof place);
              if (_setjmp(place) == 0) _longjmp(place, 1);
              say("after _setjmp and _longjmp");
              return 0;
          }
          C
          cc -o pair pair.c
          ./pair

      - name: A runtime with two generations on macOS, and _longjmp
        if: always()
        run: |
          python3 - <<'PY'
          path = 'src/runtime.c'
          s = open(path).read()

          def put(old, new):
              global s
              assert s.count(old) == 1, (old, s.count(old))
              s = s.replace(old, new)

          put('!defined(ZENO_ONE_GENERATION) && defined(__linux__)',
              '!defined(ZENO_ONE_GENERATION) && (defined(__linux__) || defined(__APPLE__))')
          put('    longjmp(handler->place, 1);\n',
              '#ifdef _WIN32\n    longjmp(handler->place, 1);\n#else\n    _longjmp(handler->place, 1);\n#endif\n')
          open(path, 'w').write(s)
          PY
          git diff

      - name: Build the tests with it
        if: always()
        run: cargo test --no-run 2>&1 | tail -n 3

      - name: The whole test suite, under a clock
        if: always()
        run: tools/probe-tests.sh 600 mended

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ inputs.machine }}
          path: found
          if-no-files-found: ignore
