# Looks into one question on one machine, and is changed for each
# question. It releases nothing.
#
# The question now: the rehearsal of 0.3.0 hung in the test suite on
# macOS on Apple silicon, in programs that the tests had compiled. A
# first look showed that a program that makes many objects ends as it
# should there, with the collector's two generations and with one. So
# this runs the test suite itself under a clock, and if it is still
# running when the clock ends, says which tests are, and where each
# compiled program is. It does it twice: as the source is, and with the
# two generations put back on macOS.

name: probe

on:
  workflow_dispatch:
    inputs:
      machine:
        description: The machine to look on
        type: choice
        options: [macos-latest, ubuntu-latest]
        default: macos-latest

jobs:
  look:
    name: ${{ inputs.machine }}
    runs-on: ${{ inputs.machine }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build the tests
        run: cargo test --no-run 2>&1 | tail -n 3

      - name: The test suite under a clock, as the source is
        run: tools/probe-tests.sh 480 as-it-is

      - name: The same with two generations on macOS
        if: always()
        run: |
          sed -i.bak 's/!defined(ZENO_ONE_GENERATION) && defined(__linux__)/!defined(ZENO_ONE_GENERATION) \&\& (defined(__linux__) || defined(__APPLE__))/' src/runtime.c
          grep -n 'ZENO_ONE_GENERATION) &&' src/runtime.c
          cargo test --no-run 2>&1 | tail -n 3
          tools/probe-tests.sh 480 two-generations

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ inputs.machine }}
          path: found
          if-no-files-found: ignore
