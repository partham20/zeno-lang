# Tries Zeno on one kind of machine. It builds `zeno`, compiles three
# examples through C and through LLVM, builds a few programs with
# `--minimal`, and runs the whole test suite.
# Nothing is packed and nothing is released.
#
# It is for a mend that can only be seen to work on a machine that is
# not at hand, which mostly means Windows. The release workflow would
# show the same, on ten machines, at four times the cost or more.
#
# Started by hand from the Actions page ("Run workflow"), choosing the
# machine. What it finds is written on the summary page of the run.
# docs/release.md has more.

name: trial

on:
  workflow_dispatch:
    inputs:
      machine:
        description: The machine to try it on
        type: choice
        options: [windows-latest, macos-latest, ubuntu-latest]
        default: windows-latest

jobs:
  trial:
    name: ${{ inputs.machine }}
    runs-on: ${{ inputs.machine }}
    # A step that never ends must not run for six hours.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      # Zeno for a browser, which `zeno build --web` writes into a page.
      - name: Build Zeno for a browser
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown

      - name: Check the build
        run: tools/release-check.sh target/release/zeno

      - name: A program compiled through C prints what `zeno run` prints
        continue-on-error: true
        run: |
          zeno=$PWD/target/release/zeno
          # Windows has no `cc`. `zeno build` finds its gcc by itself.
          mkdir through-c
          cd through-c
          status=0
          for example in shapes sensor sentence; do
            "$zeno" run ../examples/$example.zeno > ran.txt &&
              "$zeno" build ../examples/$example.zeno &&
              ./$example > built.txt &&
              diff ran.txt built.txt || { status=1; break; }
          done > log.txt 2>&1
          cat log.txt
          if [ $status -ne 0 ]; then
            echo "::error title=Compiled through C::$(tail -n 14 log.txt | tr '\r\n' ' |' | cut -c1-1200)"
          else
            echo "::notice title=Compiled through C::three examples print what zeno run prints"
          fi
          exit $status

      - name: A program compiled through LLVM prints what `zeno run` prints
        continue-on-error: true
        run: |
          zeno=$PWD/target/release/zeno
          mkdir through-llvm
          cd through-llvm
          status=0
          for example in shapes sensor sentence; do
            "$zeno" run ../examples/$example.zeno > ran.txt &&
              "$zeno" build --llvm ../examples/$example.zeno &&
              ./$example > built.txt &&
              diff ran.txt built.txt || { status=1; break; }
          done > log.txt 2>&1
          cat log.txt
          if [ $status -ne 0 ]; then
            echo "::error title=Compiled through LLVM::$(tail -n 14 log.txt | tr '\r\n' ' |' | cut -c1-1200)"
          else
            echo "::notice title=Compiled through LLVM::three examples print what zeno run prints"
          fi
          exit $status

      # `--minimal` is the same program in the least C, and a correct
      # program prints the same from it. One that does not is built
      # again for a debugger, which says where it stopped.
      - name: A program built with `--minimal` prints what `zeno run` prints
        continue-on-error: true
        run: |
          zeno=$PWD/target/release/zeno
          mkdir through-minimal
          cd through-minimal
          # The program of the test `a_minimal_build_prints_what_zeno_run_prints_for_a_correct_program`.
          sed -n '/fn a_minimal_build_prints_what_zeno_run_prints_for_a_correct_program/,/^"#;/p' ../src/emit_c.rs |
            sed -e '1,/r#"/{/r#"/!d;}' -e 's/^ *let source = r#"//' -e '$d' > whole.zeno
          cp ../examples/shapes.zeno ../examples/sensor.zeno ../examples/sentence.zeno ../examples/words.zeno ../examples/faults.zeno .
          failed=""
          for program in shapes sensor sentence words faults whole; do
            for kind in "" "--owned"; do
              rm -f $program $program.exe
              "$zeno" run $program.zeno > ran.txt 2> ran-errors.txt || true
              ended=0
              "$zeno" build --minimal $kind $program.zeno > build.txt 2>&1 || { echo "$program $kind: not built: $(tail -n 3 build.txt)"; continue; }
              ./$program > built.txt 2> built-errors.txt || ended=$?
              if [ $ended -ne 0 ] || ! diff ran.txt built.txt > differs.txt; then
                failed="$failed $program$kind"
                echo "$program $kind: ended with $ended"
                head -n 6 differs.txt built-errors.txt || true
                if command -v gdb > /dev/null; then
                  cc -Os -g -o stopped $program.c -lm 2> /dev/null || cc -Os -g -o stopped $program.c
                  gdb -batch -ex run -ex bt -ex "info registers rip rsp rbp" ./stopped 2>&1 | grep -v '^\[' | tail -n 16 > stopped.txt || true
                  cat stopped.txt
                  echo "::notice title=Where $program $kind stopped::$(tr '\r\n' ' |' < stopped.txt | cut -c1-2400)"
                fi
              fi
            done
          done
          cc --version 2>&1 | sed -n 1p || true
          if [ -n "$failed" ]; then
            echo "::error title=Built with --minimal::these differ from zeno run:$failed"
            exit 1
          fi
          echo "::notice title=Built with --minimal::every program that builds prints what zeno run prints, with the collector and with one owner"

      # Last, so that what it says is at the end of the log.
      - name: The whole test suite
        run: |
          # The whole of what the tests say is long. How it ended, which
          # tests failed and what the first of them said go on the
          # summary page.
          status=0
          cargo test -q > tests.txt 2>&1 || status=$?
          tail -n 3 tests.txt
          echo "::notice title=The test suite::$(grep '^test result' tests.txt)"
          if [ $status -ne 0 ]; then
            names=$(grep -E '^    [a-z_]+::tests::' tests.txt | sed 's/^ *//; s/::tests::/ /' | sort -u | tr '\n' '|' || true)
            echo "::notice title=The tests that failed::$(echo "$names" | cut -c1-3800)"
            grep -m 4 -A 9 'panicked at' tests.txt | cut -c1-300 > first.txt || true
            echo "::notice title=The first failures::$(tr '\r\n' ' |' < first.txt | cut -c1-2400)"
          fi
          exit $status
