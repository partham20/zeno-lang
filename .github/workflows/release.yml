# Builds `zeno` for every kind of machine it is released for, checks each
# build, and makes the release. docs/release.md walks through it.
#
# It runs when a tag such as `v0.1.0` is pushed:
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# It can also be started by hand from the Actions page ("Run workflow").
# Then it builds and checks everything and releases nothing, which is the
# way to try a change to this file. With "publish" ticked it makes the
# release as well, and the tag with it, named after the version in
# Cargo.toml. That is a release without a `git push`.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Make the release too, and its tag, from the version in Cargo.toml
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One machine that fails does not stop the others, so that one run
      # says everything that is wrong.
      fail-fast: false
      matrix:
        include:
          # `with` is the program that runs the build where the machine
          # doing the building has another processor: an emulator. `none`
          # says the build is not run at all.
          #
          # `tests` is `must` where the whole test suite has to pass
          # before anything is released, and `try` where it is run to
          # see what it says. `compiled` builds three examples with
          # `zeno build` and with `zeno build --llvm` and runs them:
          # `must` where they have to print what `zeno run` prints,
          # `try` where that is only looked at.
          - { name: linux-x86_64,   target: x86_64-unknown-linux-musl,      os: ubuntu-latest,  tests: must, compiled: must }
          - { name: linux-arm64,    target: aarch64-unknown-linux-musl,     os: ubuntu-latest,  with: qemu-aarch64 }
          - { name: linux-x86,      target: i686-unknown-linux-musl,        os: ubuntu-latest }
          - { name: linux-armv7,    target: armv7-unknown-linux-musleabihf, os: ubuntu-latest,  with: qemu-arm }
          - { name: linux-armv6,    target: arm-unknown-linux-musleabihf,   os: ubuntu-latest,  with: qemu-arm -cpu arm1176 }
          - { name: macos-arm64,    target: aarch64-apple-darwin,           os: macos-latest,   tests: try, compiled: must }
          - { name: macos-x86_64,   target: x86_64-apple-darwin,            os: macos-latest }
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc,         os: windows-latest, tests: try, compiled: try }
          - { name: windows-x86,    target: i686-pc-windows-msvc,           os: windows-latest }
          - { name: windows-arm64,  target: aarch64-pc-windows-msvc,        os: windows-latest, with: none }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: The tag names the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME and Cargo.toml says $version"
            exit 1
          fi

      - name: The whole test suite
        if: matrix.tests == 'must'
        run: cargo test

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}

      # `zeno.wasm` is Zeno built for a browser, which `zeno build --web`
      # writes into a page (docs/web.md). It is the same file whichever
      # machine builds it, and each archive carries it beside `zeno`.
      - name: Build Zeno for a browser
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown

      - name: An emulator, to run a build for another processor
        if: startsWith(matrix.with, 'qemu')
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Check the build
        if: matrix.with != 'none'
        run: tools/release-check.sh target/${{ matrix.target }}/release/zeno "${{ matrix.with }}"

      # The installer for macOS and Linux, tried where the build runs on
      # the machine's own processor (docs/install.md).
      - name: install.sh installs this build, and takes it off again
        if: matrix.tests && runner.os != 'Windows'
        run: tools/try-install.sh target/${{ matrix.target }}/release/zeno

      - name: A program compiled through C prints what `zeno run` prints
        if: matrix.compiled
        continue-on-error: ${{ matrix.compiled == 'try' }}
        run: |
          zeno=$PWD/target/${{ matrix.target }}/release/zeno
          # Windows has no `cc`. `zeno build` finds its gcc by itself.
          mkdir through-c
          cd through-c
          # What goes wrong is also put on the summary page of the run,
          # where it can be read without opening the log.
          status=0
          for example in shapes sensor sentence; do
            "$zeno" run ../examples/$example.zeno > ran.txt &&
              "$zeno" build ../examples/$example.zeno &&
              ./$example > built.txt &&
              diff ran.txt built.txt || { status=1; break; }
          done > log.txt 2>&1
          cat log.txt
          if [ $status -ne 0 ]; then
            echo "::error title=Compiled through C on ${{ matrix.name }}::$(tail -n 14 log.txt | tr '\r\n' ' |' | cut -c1-1200)"
          fi
          exit $status

      - name: A program compiled through LLVM prints what `zeno run` prints
        if: matrix.compiled
        continue-on-error: ${{ matrix.compiled == 'try' }}
        run: |
          zeno=$PWD/target/${{ matrix.target }}/release/zeno
          mkdir through-llvm
          cd through-llvm
          # What goes wrong is also put on the summary page of the run,
          # where it can be read without opening the log.
          status=0
          for example in shapes sensor sentence; do
            "$zeno" run ../examples/$example.zeno > ran.txt &&
              "$zeno" build --llvm ../examples/$example.zeno &&
              ./$example > built.txt &&
              diff ran.txt built.txt || { status=1; break; }
          done > log.txt 2>&1
          cat log.txt
          if [ $status -ne 0 ]; then
            echo "::error title=Compiled through LLVM on ${{ matrix.name }}::$(tail -n 14 log.txt | tr '\r\n' ' |' | cut -c1-1200)"
          fi
          exit $status

      - name: Pack
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          folder=zeno-$version-${{ matrix.name }}
          mkdir "$folder"
          cp -r LICENSE README.md docs examples editors "$folder"
          cp target/wasm32-unknown-unknown/release/zeno.wasm "$folder"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/zeno.exe "$folder"
            7z a "$folder.zip" "$folder"
          else
            cp target/${{ matrix.target }}/release/zeno "$folder"
            tar -czf "$folder.tar.gz" "$folder"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            zeno-*.tar.gz
            zeno-*.zip
          if-no-files-found: error

      # Last, so that what it says is at the end of the log.
      - name: The whole test suite, to see what it says on this system
        if: matrix.tests == 'try'
        continue-on-error: true
        run: |
          # The whole of what the tests say is long. The end of it, and
          # how many tests of each part failed, go on the summary page.
          status=0
          cargo test -q > tests.txt 2>&1 || status=$?
          tail -n 3 tests.txt
          parts=$(grep -E '^    [a-z_]+::tests::' tests.txt | sed 's/^ *//; s/::tests::.*//' | sort | uniq -c | tr '\n' ' ' || true)
          echo "::notice title=The test suite on ${{ matrix.name }}::$(grep '^test result' tests.txt) Failed, by part: ${parts:-none}"
          if [ $status -ne 0 ]; then
            grep -m 4 -A 9 'panicked at' tests.txt | cut -c1-300 > first.txt || true
            echo "::notice title=The first failures on ${{ matrix.name }}::$(tr '\r\n' ' |' < first.txt | cut -c1-2400)"
          fi
          exit $status

  # The setup program for Windows: one .exe that holds the three Windows
  # builds and installs the one for the machine it is run on
  # (tools/installer/zeno.iss, docs/install.md). It is made from the
  # builds above, installed here, run, and uninstalled.
  installer:
    name: windows-setup
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: got
          merge-multiple: true

      - name: The files that go into it
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir files
          for kind in x86_64 x86 arm64; do
            7z x -y "got/zeno-$version-windows-$kind.zip" -ounpacked > /dev/null
            mkdir files/$kind
            cp "unpacked/zeno-$version-windows-$kind/zeno.exe" files/$kind
          done
          # The rest is the same in all three.
          cd "unpacked/zeno-$version-windows-x86_64"
          cp -r zeno.wasm LICENSE README.md docs examples editors ../../files

      - name: Build the setup program
        shell: cmd
        run: tools\installer\build.cmd %VERSION% files

      - name: Install with it, run Zeno, and uninstall
        shell: pwsh
        run: tools\installer\try.ps1 "zeno-$($env:VERSION)-windows-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: zeno-*-windows-setup.exe
          if-no-files-found: error

  # The packages for apt, pacman, snap and flatpak, and the recipes for
  # Homebrew and winget, made from what was just built
  # (tools/package.sh). Each is installed as somebody would install it,
  # run and removed (tools/try-packages.sh). docs/packages.md.
  packages:
    name: packages
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: What makes a flatpak
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak
          # Ubuntu does not let a program that is not root make a box
          # of the kind a flatpak runs in, unless it is told to.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Make the packages
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          tools/package.sh "$version" files out

      - name: apt installs the .deb, and removes it
        run: tools/try-packages.sh deb "$VERSION" out

      - name: snap installs the .snap, and removes it
        run: tools/try-packages.sh snap "$VERSION" out

      - name: pacman installs its package, and removes it
        run: tools/try-packages.sh pacman "$VERSION" out

      - name: flatpak installs the .flatpak, and removes it
        run: tools/try-packages.sh flatpak "$VERSION" out

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out
          if-no-files-found: error

  # Homebrew is on macOS. Its formula is tried with the archives of
  # this run in place of the release, which does not exist yet.
  brew:
    name: Homebrew
    needs: packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: files
          merge-multiple: true

      - name: Homebrew installs from the formula, and removes it
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tools/try-packages.sh brew "$version" out files

  release:
    name: release
    needs: [build, installer, packages, brew]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packed
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag=v$version
          # The installer for macOS and Linux is a file of the release,
          # so that one line downloads it and runs it.
          cp tools/install.sh packed
          cd packed
          # The archives, the setup program and the packages. A .deb
          # and a .snap are named `zeno_`, as their systems name them.
          files=$(ls -d zeno-* zeno_* install.sh)
          # One line for each file, to check a download against with
          # `sha256sum --check`.
          sha256sum $files > SHA256SUMS.txt
          notes=../docs/releases/$version.md
          if gh release view "$tag" > /dev/null 2>&1; then
            # The release was drafted on the website, which made the tag.
            gh release upload "$tag" --clobber $files SHA256SUMS.txt
            gh release edit "$tag" --title "Zeno $version" --notes-file "$notes"
          else
            # `--target` makes the tag here when no tag was pushed.
            gh release create "$tag" --target "$GITHUB_SHA" --title "Zeno $version" \
              --notes-file "$notes" $files SHA256SUMS.txt
          fi

      # The Homebrew formula, the PKGBUILD and the winget files name
      # the files of this release and their checksums. They are kept
      # in the repository, on `main`, where Homebrew reads the formula.
      - name: Keep the recipes in the repository
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tools/keep-recipes.sh packed/recipes "$version"
