# Holds every target language to `zeno run`, on the newest version of
# each language, once a week (decision 24.9).
#
# It installs the newest Node, TypeScript, Python, PHP, Lua, Ruby, Dart,
# Kotlin, Go, Java, .NET, C++ and Rust (with its WebAssembly target), and
# Playwright's Chromium for the page, then runs tools/targets.py: every example, every sample of the book and the
# corner programs in tools/targets/, built for every target and compared
# with what `zeno run` prints. A language that changes under us shows up
# here first. Its report is kept with the run.
#
# Also started by hand from the Actions page ("Run workflow"), and on a
# push that changes a runtime, a printer or the lowering.

name: targets

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/lower.rs"
      - "src/emit_*.rs"
      - "src/runtime.*"
      - "tools/targets.py"
      - "tools/targets/**"

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    # Kotlin is compiled for every program, some ten seconds each.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Rust, with its WebAssembly target
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: TypeScript's compiler
        run: npm install --global typescript

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          coverage: none

      - name: Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - uses: dart-lang/setup-dart@v1

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # After Java: `kotlinc` runs on it. The machine comes with Kotlin.
      - name: Kotlin
        run: command -v kotlinc || sudo snap install --classic kotlin

      - name: The newest g++
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
          g++ --version

      - name: Playwright, for the page
        run: |
          cd tools && npm install --no-save playwright && npx playwright install --with-deps chromium

      - name: Build Zeno
        run: cargo build --release

      - name: Every program, in every language
        run: |
          for tool in node tsc python3 php ruby dart go java dotnet g++ rustc; do "$tool" --version 2>&1 | head -1; done
          lua5.4 -v
          kotlinc -version 2>&1 | tail -1
          python3 tools/targets.py | tee targets-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targets-report
          path: targets-report.txt
