# Holds every target language to `zeno run`, on the newest version of
# each language, once a week (decision 24.9).
#
# It installs the newest Node, Python, Go, Java, .NET, C++ and Rust (with
# its WebAssembly target), and Playwright's Chromium for the page, then
# runs tools/targets.py: every example, every sample of the book and the
# corner programs in tools/targets/, built for every target and compared
# with what `zeno run` prints. A language that changes under us shows up
# here first. Its report is kept with the run.
#
# Also started by hand from the Actions page ("Run workflow"), and on a
# push that changes a runtime, a printer or the lowering.

name: targets

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/lower.rs"
      - "src/emit_*.rs"
      - "src/runtime.*"
      - "tools/targets.py"
      - "tools/targets/**"

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust, with its WebAssembly target
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-wasip1

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: The newest g++
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
          g++ --version

      - name: Playwright, for the page
        run: |
          cd tools && npm install --no-save playwright && npx playwright install --with-deps chromium

      - name: Build Zeno
        run: cargo build --release

      - name: Every program, in every language
        run: |
          for tool in node python3 go java dotnet g++ rustc; do "$tool" --version 2>&1 | head -1; done
          python3 tools/targets.py | tee targets-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targets-report
          path: targets-report.txt
